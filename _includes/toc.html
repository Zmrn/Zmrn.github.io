<div id="toc-container"></div>

<script>
(function() {
  const content = document.querySelector('.main-content');
  if (!content) return;
  
  const headings = content.querySelectorAll('h1, h2, h3, h4, h5, h6');
  if (headings.length === 0) return;
  
  const tocContainer = document.getElementById('toc-container');
  const toc = document.createElement('ul');
  toc.className = 'toc-list';
  
  let currentLevel = 1;
  let currentList = toc;
  const stack = [toc];
  
  headings.forEach((heading, index) => {
    // 跳过文章标题（第一个h1）
    if (heading.tagName === 'H1' && index === 0) return;
    
    const level = parseInt(heading.tagName.substring(1));
    const text = heading.textContent;
    const id = heading.id || 'heading-' + index;
    
    if (!heading.id) {
      heading.id = id;
    }
    
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = '#' + id;
    a.textContent = text;
    a.className = 'toc-link toc-level-' + level;
    li.appendChild(a);
    
    if (level > currentLevel) {
      const newList = document.createElement('ul');
      newList.className = 'toc-sublist';
      const lastLi = currentList.lastElementChild;
      if (lastLi) {
        lastLi.appendChild(newList);
      }
      stack.push(newList);
      currentList = newList;
    } else if (level < currentLevel) {
      const diff = currentLevel - level;
      for (let i = 0; i < diff && stack.length > 1; i++) {
        stack.pop();
      }
      currentList = stack[stack.length - 1];
    }
    
    currentList.appendChild(li);
    currentLevel = level;
  });
  
  if (toc.children.length > 0) {
    tocContainer.appendChild(toc);
  }
  
  // 平滑滚动
  document.querySelectorAll('.toc-link').forEach(link => {
    link.addEventListener('click', function(e) {
      e.preventDefault();
      const target = document.querySelector(this.getAttribute('href'));
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        // 更新URL但不滚动
        history.pushState(null, null, this.getAttribute('href'));
      }
    });
  });
})();
</script>
