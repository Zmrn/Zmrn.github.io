<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 580' role='img' aria-labelledby='title desc'>
  <title id='title'>ADD 将新单位加入客户端单位哈希表</title>
  <desc id='desc'>服务器单位哈希表包含两个单位，中间 Modifier 携带 unit-2048 的 ADD 和完整值，客户端数据镜像应用后从一个条目增加到两个条目。</desc>
  <defs>
    <marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 10 5 0 10z' fill='#667085'/></marker>
    <style>
      text{font-family:Inter,'Microsoft YaHei',Arial,sans-serif;letter-spacing:0}.label{fill:#667085;font-size:13px;font-weight:600}.heading{fill:#172033;font-size:20px;font-weight:700}.field{fill:#667085;font-size:12px}.value{fill:#172033;font-size:14px;font-weight:650}.mono{font-family:Consolas,'Cascadia Mono',monospace}.server{fill:#356a9a}.modifier{fill:#8a512d}.client{fill:#2f6f4e}
    </style>
  </defs>
  <rect width='1200' height='580' fill='#f4f6f8'/>
  <path d='M340 290h40' fill='none' stroke='#667085' stroke-width='2' marker-end='url(#arrow)'/>
  <path d='M820 290h30' fill='none' stroke='#667085' stroke-width='2' marker-end='url(#arrow)'/>

  <g>
    <rect x='40' y='70' width='300' height='440' rx='8' fill='#fff' stroke='#b9c9dc' stroke-width='1.5'/>
    <path d='M48 70h284a8 8 0 0 1 8 8v72H40V78a8 8 0 0 1 8-8z' fill='#dfeaf6'/>
    <g transform='translate(62 94)' fill='none' stroke='#356a9a' stroke-width='2'><rect width='32' height='32' rx='3'/><path d='M10 5L7 27M23 5l-3 22M4 13h25M3 21h25'/></g>
    <text x='108' y='116' class='heading'>服务器单位哈希表</text>
    <text x='64' y='184' class='label mono'>UNITS</text><text x='316' y='184' class='label server' text-anchor='end'>2 entries</text>
    <text x='64' y='216' class='field mono'>KEY</text><text x='178' y='216' class='field mono'>VALUE</text>
    <rect x='60' y='232' width='260' height='88' rx='7' fill='#f8f9fb' stroke='#e4e7ec'/>
    <text x='72' y='280' class='value mono'>unit-1042</text>
    <text x='178' y='258' class='field mono'>UNIT</text><text x='178' y='282' class='value mono'>L18 · HP1320</text><text x='178' y='302' class='value mono'>ATK224</text>
    <rect x='60' y='336' width='260' height='88' rx='7' fill='#eaf6ef' stroke='#9fcbb3' stroke-width='1.5'/>
    <text x='72' y='384' class='value mono'>unit-2048</text>
    <text x='178' y='362' class='field mono'>UNIT</text><text x='178' y='386' class='value mono'>L1 · HP100</text><text x='178' y='406' class='value mono'>ATK10</text>
    <circle cx='301' cy='353' r='10' fill='#2f6f4e'/><path d='M296 353h10M301 348v10' stroke='#fff' stroke-width='2'/>
    <rect x='60' y='448' width='260' height='38' rx='6' fill='#edf6ff'/><text x='80' y='473' class='label server'>HASH TABLE · 2 ENTRIES</text>
  </g>

  <g>
    <text x='390' y='44' class='label modifier'>MODIFIER</text><text x='810' y='44' class='label modifier' text-anchor='end'>1 change</text>
    <rect x='390' y='70' width='420' height='440' rx='8' fill='#fff' stroke='#9fcbb3' stroke-width='1.5'/>
    <rect x='410' y='92' width='68' height='28' rx='5' fill='#e2f3e9'/><text x='444' y='111' text-anchor='middle' class='label client'>ADD</text>
    <text x='410' y='158' class='field mono'>target</text><text x='410' y='183' class='value mono'>units</text>
    <text x='566' y='158' class='field mono'>id</text><text x='566' y='183' class='value mono'>unit-2048</text>
    <path d='M410 208h380' stroke='#e4e7ec'/><text x='410' y='238' class='field mono'>value</text>
    <rect x='410' y='256' width='380' height='212' rx='7' fill='#eef8f2' stroke='#b8dbc7'/>
    <text x='430' y='287' class='label client'>UNIT OBJECT</text>
    <text x='430' y='326' class='field mono'>id</text><text x='548' y='326' class='value mono'>unit-2048</text>
    <text x='430' y='366' class='field mono'>level</text><text x='548' y='366' class='value mono'>1</text>
    <text x='430' y='406' class='field mono'>max_hp</text><text x='548' y='406' class='value mono'>100</text>
    <text x='430' y='446' class='field mono'>attack</text><text x='548' y='446' class='value mono'>10</text>
  </g>

  <g>
    <rect x='850' y='70' width='310' height='440' rx='8' fill='#fff' stroke='#aac9b8' stroke-width='1.5'/>
    <path d='M858 70h294a8 8 0 0 1 8 8v72H850V78a8 8 0 0 1 8-8z' fill='#e2f0e8'/>
    <g transform='translate(872 94)' fill='none' stroke='#2f6f4e' stroke-width='2'><rect width='32' height='32' rx='3'/><path d='M10 5L7 27M23 5l-3 22M4 13h25M3 21h25'/></g>
    <text x='918' y='116' class='heading'>客户端数据镜像</text>
    <text x='874' y='184' class='label mono'>UNITS</text><text x='1136' y='184' class='label client' text-anchor='end'>1 → 2 entries</text>
    <text x='874' y='216' class='field mono'>KEY</text><text x='988' y='216' class='field mono'>VALUE</text>
    <rect x='870' y='232' width='270' height='88' rx='7' fill='#f8f9fb' stroke='#e4e7ec'/>
    <text x='882' y='280' class='value mono'>unit-1042</text>
    <text x='988' y='258' class='field mono'>UNIT</text><text x='988' y='282' class='value mono'>L18 · HP1320</text><text x='988' y='302' class='value mono'>ATK224</text>
    <rect x='870' y='336' width='270' height='88' rx='7' fill='#eaf6ef' stroke='#9fcbb3' stroke-width='1.5'/>
    <text x='882' y='384' class='value mono'>unit-2048</text>
    <text x='988' y='362' class='field mono'>UNIT</text><text x='988' y='386' class='value mono'>L1 · HP100</text><text x='988' y='406' class='value mono'>ATK10</text>
    <circle cx='1121' cy='353' r='10' fill='#2f6f4e'/><path d='M1116 353h10M1121 348v10' stroke='#fff' stroke-width='2'/>
    <rect x='870' y='448' width='270' height='38' rx='6' fill='#eaf6ef'/><path d='M890 466l6 6 11-13' fill='none' stroke='#2f6f4e' stroke-width='2.5'/><text x='920' y='473' class='label client'>KEY ADDED</text>
  </g>
</svg>
