<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 580' role='img' aria-labelledby='title desc'>
  <title id='title'>REMOVE 将单位从客户端单位哈希表移除</title>
  <desc id='desc'>服务器与客户端单位哈希表都以红色叉号标出已移除的 unit-2048，中间 Modifier 携带该单位的 REMOVE，客户端有效条目数从两个减少到一个。</desc>
  <defs>
    <marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 10 5 0 10z' fill='#667085'/></marker>
    <style>
      text{font-family:Inter,'Microsoft YaHei',Arial,sans-serif;letter-spacing:0}.label{fill:#667085;font-size:13px;font-weight:600}.heading{fill:#172033;font-size:20px;font-weight:700}.field{fill:#667085;font-size:12px}.value{fill:#172033;font-size:14px;font-weight:650}.mono{font-family:Consolas,'Cascadia Mono',monospace}.server{fill:#356a9a}.client{fill:#2f6f4e}.danger{fill:#a44b4b}
    </style>
  </defs>
  <rect width='1200' height='580' fill='#f4f6f8'/>
  <path d='M340 290h40' fill='none' stroke='#667085' stroke-width='2' marker-end='url(#arrow)'/>
  <path d='M820 290h30' fill='none' stroke='#667085' stroke-width='2' marker-end='url(#arrow)'/>

  <g>
    <rect x='40' y='70' width='300' height='440' rx='8' fill='#fff' stroke='#b9c9dc' stroke-width='1.5'/>
    <path d='M48 70h284a8 8 0 0 1 8 8v72H40V78a8 8 0 0 1 8-8z' fill='#dfeaf6'/>
    <g transform='translate(62 94)' fill='none' stroke='#356a9a' stroke-width='2'><rect width='32' height='32' rx='3'/><path d='M10 5L7 27M23 5l-3 22M4 13h25M3 21h25'/></g>
    <text x='108' y='116' class='heading'>服务器单位哈希表</text>
    <text x='64' y='184' class='label mono'>UNITS</text><text x='316' y='184' class='label server' text-anchor='end'>1 entry</text>
    <text x='64' y='216' class='field mono'>KEY</text><text x='178' y='216' class='field mono'>VALUE</text>
    <rect x='60' y='232' width='260' height='88' rx='7' fill='#f8f9fb' stroke='#e4e7ec'/>
    <text x='72' y='280' class='value mono'>unit-1042</text>
    <text x='178' y='258' class='field mono'>UNIT</text><text x='178' y='282' class='value mono'>L18 · HP1320</text><text x='178' y='302' class='value mono'>ATK224</text>
    <rect x='60' y='344' width='260' height='80' rx='7' fill='#fdf1f1' stroke='#d5a6a6' stroke-width='1.5'/>
    <text x='72' y='390' class='value mono danger'>unit-2048</text>
    <text x='178' y='364' class='field mono danger'>UNIT</text><text x='178' y='388' class='value mono danger'>L1 · HP100</text><text x='178' y='408' class='value mono danger'>ATK10</text>
    <path d='M76 354l228 60M304 354L76 414' stroke='#a44b4b' stroke-width='5' stroke-linecap='round' opacity='.78'/>
    <rect x='60' y='448' width='260' height='38' rx='6' fill='#edf6ff'/><text x='80' y='473' class='label server'>HASH TABLE · 1 ENTRY</text>
  </g>

  <g>
    <text x='390' y='44' class='label danger'>MODIFIER</text><text x='810' y='44' class='label danger' text-anchor='end'>1 change</text>
    <rect x='390' y='70' width='420' height='440' rx='8' fill='#fff' stroke='#d5a6a6' stroke-width='1.5'/>
    <rect x='410' y='92' width='88' height='28' rx='5' fill='#f8e7e7'/><text x='454' y='111' text-anchor='middle' class='label danger'>REMOVE</text>
    <text x='410' y='158' class='field mono'>target</text><text x='410' y='183' class='value mono'>units</text>
    <text x='566' y='158' class='field mono'>id</text><text x='566' y='183' class='value mono'>unit-2048</text>
    <path d='M410 208h380' stroke='#e4e7ec'/><text x='410' y='238' class='field mono'>key</text>
    <rect x='410' y='256' width='380' height='96' rx='7' fill='#fdf1f1' stroke='#d5a6a6'/>
    <circle cx='442' cy='304' r='12' fill='#a44b4b'/><path d='M435 304h14' stroke='#fff' stroke-width='2'/>
    <text x='472' y='310' class='value mono danger'>unit-2048</text>
    <rect x='410' y='378' width='380' height='48' rx='6' fill='#f8e7e7'/><text x='430' y='408' class='label danger'>DELETE KEY FROM HASH TABLE</text>
  </g>

  <g>
    <rect x='850' y='70' width='310' height='440' rx='8' fill='#fff' stroke='#aac9b8' stroke-width='1.5'/>
    <path d='M858 70h294a8 8 0 0 1 8 8v72H850V78a8 8 0 0 1 8-8z' fill='#e2f0e8'/>
    <g transform='translate(872 94)' fill='none' stroke='#2f6f4e' stroke-width='2'><rect width='32' height='32' rx='3'/><path d='M10 5L7 27M23 5l-3 22M4 13h25M3 21h25'/></g>
    <text x='918' y='116' class='heading'>客户端数据镜像</text>
    <text x='874' y='184' class='label mono'>UNITS</text><text x='1136' y='184' class='label client' text-anchor='end'>2 → 1 entries</text>
    <text x='874' y='216' class='field mono'>KEY</text><text x='988' y='216' class='field mono'>VALUE</text>
    <rect x='870' y='232' width='270' height='88' rx='7' fill='#f8f9fb' stroke='#e4e7ec'/>
    <text x='882' y='280' class='value mono'>unit-1042</text>
    <text x='988' y='258' class='field mono'>UNIT</text><text x='988' y='282' class='value mono'>L18 · HP1320</text><text x='988' y='302' class='value mono'>ATK224</text>
    <rect x='870' y='344' width='270' height='80' rx='7' fill='#fdf1f1' stroke='#d5a6a6' stroke-width='1.5'/>
    <text x='882' y='390' class='value mono danger'>unit-2048</text>
    <text x='988' y='364' class='field mono danger'>UNIT</text><text x='988' y='388' class='value mono danger'>L1 · HP100</text><text x='988' y='408' class='value mono danger'>ATK10</text>
    <path d='M886 354l238 60M1124 354l-238 60' stroke='#a44b4b' stroke-width='5' stroke-linecap='round' opacity='.78'/>
    <rect x='870' y='448' width='270' height='38' rx='6' fill='#f8e7e7'/><circle cx='891' cy='467' r='8' fill='#a44b4b'/><path d='M886 467h10' stroke='#fff' stroke-width='2'/><text x='912' y='473' class='label danger'>KEY REMOVED</text>
  </g>
</svg>
