<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 500' role='img' aria-labelledby='title desc'>
  <title id='title'>一条携带完整单位对象的 Modifier 更新</title>
  <desc id='desc'>左侧为服务器单位状态，中间为一条携带完整单位的 UPDATE，右侧为客户端数据镜像。</desc>
  <defs>
    <marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0 0 10 5 0 10z' fill='#667085'/></marker>
    <style>
      text{font-family:Inter,'Microsoft YaHei',Arial,sans-serif;letter-spacing:0}.label{fill:#667085;font-size:13px;font-weight:600}.heading{fill:#172033;font-size:20px;font-weight:700}.field{fill:#667085;font-size:12px}.value{fill:#172033;font-size:15px;font-weight:650}.mono{font-family:Consolas,'Cascadia Mono',monospace}.server{fill:#356a9a}.modifier{fill:#8a512d}.client{fill:#2f6f4e}.danger{fill:#a44b4b}
    </style>
  </defs>
  <rect width='1200' height='500' fill='#f4f6f8'/>
  <path d='M286 276h43' fill='none' stroke='#667085' stroke-width='2' marker-end='url(#arrow)'/>
  <path d='M871 276h43' fill='none' stroke='#667085' stroke-width='2' marker-end='url(#arrow)'/>

  <g>
    <rect x='40' y='96' width='246' height='360' rx='8' fill='#fff' stroke='#b9c9dc' stroke-width='1.5'/>
    <path d='M48 96h230a8 8 0 0 1 8 8v62H40v-62a8 8 0 0 1 8-8z' fill='#dfeaf6'/>
    <g transform='translate(62 117)' fill='none' stroke='#356a9a' stroke-width='2'><rect width='30' height='28' rx='3'/><path d='M6 8h18M6 14h18M6 20h12'/></g>
    <text x='106' y='125' class='label server'>SERVER</text><text x='106' y='147' class='heading'>权威单位状态</text>
    <text x='64' y='202' class='label'>UNIT</text><text x='64' y='230' class='value mono'>unit-1042</text><path d='M64 250h198' stroke='#e4e7ec'/>
    <text x='64' y='284' class='field mono'>level</text><text x='262' y='284' class='value mono' text-anchor='end'>18</text>
    <text x='64' y='328' class='field mono'>max_hp</text><text x='262' y='328' class='value mono' text-anchor='end'>1320</text>
    <text x='64' y='372' class='field mono'>attack</text><text x='262' y='372' class='value mono' text-anchor='end'>224</text>
    <rect x='64' y='396' width='198' height='38' rx='6' fill='#edf6ff'/><circle cx='84' cy='415' r='6' fill='#356a9a'/><text x='100' y='420' class='label server'>FINAL STATE</text>
  </g>

  <g>
    <text x='354' y='50' class='label modifier'>MODIFIER</text><text x='354' y='77' class='heading'>1 change</text>
    <rect x='354' y='96' width='492' height='360' rx='8' fill='#fff' stroke='#d7b996' stroke-width='1.5'/>
    <rect x='374' y='116' width='88' height='28' rx='5' fill='#e7f0fb'/><text x='418' y='135' text-anchor='middle' class='label server'>UPDATE</text>
    <text x='374' y='178' class='field mono'>target</text><text x='374' y='203' class='value mono'>units</text>
    <text x='526' y='178' class='field mono'>id</text><text x='526' y='203' class='value mono'>unit-1042</text>
    <path d='M374 226h452' stroke='#e4e7ec'/><text x='374' y='254' class='field mono'>value</text>
    <rect x='374' y='272' width='452' height='160' rx='7' fill='#fff8ef' stroke='#ecd5b8'/>
    <text x='394' y='301' class='label'>UNIT OBJECT</text>
    <text x='394' y='334' class='field mono'>id</text><text x='548' y='334' class='value mono'>unit-1042</text>
    <text x='394' y='370' class='field mono'>level</text><text x='490' y='370' class='value mono'>18</text>
    <text x='564' y='370' class='field mono'>max_hp</text><text x='650' y='370' class='value mono'>1320</text>
    <text x='394' y='406' class='field mono'>attack</text><text x='490' y='406' class='value mono'>224</text>
  </g>

  <g>
    <rect x='914' y='96' width='246' height='360' rx='8' fill='#fff' stroke='#aac9b8' stroke-width='1.5'/>
    <path d='M922 96h230a8 8 0 0 1 8 8v62H914v-62a8 8 0 0 1 8-8z' fill='#e2f0e8'/>
    <g transform='translate(936 117)' fill='none' stroke='#2f6f4e' stroke-width='2'><rect width='32' height='26' rx='3'/><path d='M7 26v6M25 26v6M4 32h24'/></g>
    <text x='980' y='137' class='heading'>客户端数据镜像</text>
    <text x='938' y='202' class='label'>UNIT</text><text x='938' y='230' class='value mono'>unit-1042</text><path d='M938 250h198' stroke='#e4e7ec'/>
    <text x='938' y='284' class='field mono'>level</text><text x='1136' y='284' class='value mono' text-anchor='end'>18</text>
    <text x='938' y='328' class='field mono'>max_hp</text><text x='1136' y='328' class='value mono' text-anchor='end'>1320</text>
    <text x='938' y='372' class='field mono'>attack</text><text x='1136' y='372' class='value mono' text-anchor='end'>224</text>
    <rect x='938' y='396' width='198' height='38' rx='6' fill='#eaf6ef'/><path d='M956 414l6 6 11-13' fill='none' stroke='#2f6f4e' stroke-width='2.5'/><text x='984' y='420' class='label client'>MIRROR REPLACED</text>
  </g>
</svg>
